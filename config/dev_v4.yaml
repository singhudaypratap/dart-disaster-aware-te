# DEVELOPMENT RUN: Abilene + Bellsouth are the development set after the failed pilot.
# These results guide design only; they are NOT the test. The frozen method is tested once on
# AttMpls, BtNorthAmerica and Geant2012 with a criterion written before that run.

# PILOT: does risk-diverse path choice (DART-opt) cut tail routable loss at the same path count?
#
# PRE-REGISTERED SUCCESS CRITERION (written before the pilot was run, 2026-11-08):
#   On BOTH topologies, on the held-out TEST natural scenarios (2018-2024 hurricanes + test-seed
#   random disks), dart_nat_k4 must have lower p95 AND lower worst-case lost_routing_frac than the
#   best classical k=4 rule (ksp_hops_k4, edge_disjoint_k4, geo_diverse_k4; "best" = lowest value
#   of that statistic), while its no-failure MLU ratio to optimal is <= 1.05 x that of ksp_hops_k4.
#   Paired two-sided Wilcoxon signed-rank on per-scenario lost_routing_frac (dart_nat vs each
#   classical rule), Holm-corrected over all comparisons, reported alongside.
#   If the criterion fails -> switch to the benchmark-paper fallback.

run:
  name: dev_dart_v4
  seed: 20261108

data_dir: data/raw

topologies:
  - name: abilene
    format: sndlib_xml
    file: sndlib/abilene.xml
    capacity_policy: preinstalled
    uniform_capacity_mbps: null
    assume_unit_if_missing: null
  - name: bellsouth
    format: topohub_json
    file: topozoo/Bellsouth.json
    capacity_policy: uniform
    uniform_capacity_mbps: 10000.0
    demand_model: gravity_degree

judged_rule: dart_v4_k4
extra_rules: [dart_v3_k4, dart_v4_k4, dart_v4_adv_k4]

target_optimal_mlu: 0.6
k: 4
k_reference: 8                  # ksp_hops with 8 paths, reported for context only
candidates:
  n_candidates: 32
  max_stretch_km: 3.0           # candidate length <= 3.0 x shortest (km)
geo_sep_km: 50.0                # geo_diverse: points closer than this count as "shared risk"
link_step_km: 10.0

hurricanes:
  hurdat2_file: events/hurdat2-1851-2025-092326.txt
  wind_kt: [34, 64]
  interp_hours: 1.0
  train: [AL032004, AL062004, AL092004, AL112004, AL042005, AL122005, AL182005, AL252005,
          AL092008, AL182012, AL092017, AL112017]                      # 2004-2017
  test: [AL062018, AL142018, AL132020, AL092021, AL092022, AL102023,
         AL022024, AL092024, AL142024]                                # 2018-2024, never seen

disks:
  radii_km: [50, 100, 200, 400]
  n_per_radius_train: 200
  n_per_radius_test: 200        # independent RNG stream from training
  margin_deg: 1.0
  max_tries: 200000

cuts:
  train_k: [1, 2]               # used only by dart_adv
  test_k: {abilene: [1, 2, 3], bellsouth: [1, 2]}

family_weights:                 # each family's scenario weights sum to this (training objective)
  hurricane: 1.0
  disk: 1.0
  cut: 1.0
