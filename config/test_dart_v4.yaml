# FINAL ONE-SHOT TEST of the frozen DART v4 (dte/pathsel.py:select_dart_v4).
# Written and committed BEFORE this test was run (2026-11-08). The three topologies below were
# never used during pilot or development (development used Abilene + Bellsouth only).
#
# PRE-REGISTERED CRITERION ("final_v4"), evaluated per topology on held-out NATURAL test scenarios
# (2018-2024 hurricanes, 2019-2023 earthquakes, test-seed random disks):
#   (1) CVaR95 of routable loss (mean of the worst 5% scenarios) of dart_v4_k4 is lower than that
#       of every classical k=4 rule (ksp_hops_k4, edge_disjoint_k4, geo_diverse_k4);
#   (2) mean routable loss of dart_v4_k4 is lower than every classical k=4 rule, and the paired
#       two-sided Wilcoxon signed-rank test vs EACH classical rule is significant at 0.05 after
#       Holm correction over all 9 comparisons, with a negative mean difference;
#   (3) no-failure MLU of dart_v4_k4 <= 1.05 x that of ksp_hops_k4.
# PASS = all three topologies pass. PARTIAL = two pass. Otherwise FAIL. Reported as-is.
# Change vs the pilot criterion (disclosed): the single-worst-scenario condition was replaced by
# CVaR95 during development because a single scenario is statistically fragile; the worst case
# is still reported. Link-cut results (k=1,2) are secondary and not part of the criterion.
run:
  name: test_dart_v4
  seed: 20261109
data_dir: data/raw
topologies:
